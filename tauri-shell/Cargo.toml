[package]
name = "tauri-shell"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Tauri 2.x desktop shell with open-ended connectors for any TS frontend and Python/TS backend."
authors = []
license = "MIT OR Apache-2.0"
default-run = "tauri-shell"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
# Tauri core + plugins
tauri = { version = "2.10", features = ["tray-icon", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-persisted-scope = "2"

# Async + serialization
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Utilities
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
regex = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
dirs = "5"
ctrlc = "3"
which = "6"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
open = "5"

# macOS-specific
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSColor", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSNotification", "NSString", "NSObject"] }

# Windows-specific (for autostart .lnk via COM)
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser", "objbase", "shobjidl_core", "shlobj",
    "combaseapi", "unknwnbase", "objidl", "wtypesbase",
    "winerror", "minwindef", "wtypes", "oleauto"
] }

# Desktop-only plugins
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "tauri-shell"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
