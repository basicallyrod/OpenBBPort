[package]
name = "tauri-shell"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Tauri 2.x desktop shell with open-ended connectors for any TS frontend and Python/TS backend."
authors = []
license = "MIT OR Apache-2.0"
default-run = "tauri-shell"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
# HTTP client for Python REST proxy
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Tauri core + plugins
tauri = { version = "2.10", features = ["tray-icon", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-persisted-scope = "2"

# Async + serialization
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Utilities
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
regex = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
dirs = "5"
ctrlc = "3"
which = "6"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
open = "5"

# CLI argument parser for the `tauri-shell-cli` companion binary.
clap = { version = "4", features = ["derive", "env"] }

# Optional: TypeScript binding generator. Enable with `--features bindings`
# and run `cargo test --features bindings --test bindings_export` to emit
# .ts files into ../bindings/.
ts-rs = { version = "9", features = ["serde-json-impl", "chrono-impl"], optional = true }

# macOS-specific
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSColor", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSNotification", "NSString", "NSObject"] }

# Windows-specific (for autostart .lnk via COM)
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser", "objbase", "shobjidl_core", "shlobj",
    "combaseapi", "unknwnbase", "objidl", "wtypesbase",
    "winerror", "minwindef", "wtypes", "oleauto"
] }

# Desktop-only plugins
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Auto-generate TypeScript bindings for every IPC payload + event + state struct.
# Drives Slice A from SPEC.md. With this feature on, every annotated struct
# becomes `ts_rs::TS` and the `bindings_export` test forces export.
bindings = ["dep:ts-rs"]

[dev-dependencies]
# Mock HTTP server for proxy.rs integration tests.
httpmock = "0.7"
# Scratch dirs for settings + log_storage tests.
tempfile = "3"
# Serialize tests that touch global state (LOG_STORAGE, INSTALLATION_PROGRESS,
# RunningProcesses) so they don't race.
serial_test = "3"
# Enables `tauri::test::mock_builder` / `mock_app` so `tests/cleanup.rs` can
# build an `AppHandle` for the cleanup cascade without booting a real window.
tauri = { version = "2.10", features = ["test"] }

[[bin]]
name = "tauri-shell"
path = "src/main.rs"

# Companion CLI binary. Exercises the same Rust functions that back the
# Tauri commands, but from a terminal — useful for connector testing,
# scripting, and CI.
[[bin]]
name = "tauri-shell-cli"
path = "src/bin/cli.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
